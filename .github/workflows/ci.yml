name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Core, layout, channel, and bundle checks
        run: ./scripts/check.sh
      - name: Diagnose test launch failure
        if: failure()
        run: |
          codesign --verify --strict --verbose=4 .build/debug/PrompterChecks || true
          codesign --display --entitlements - .build/debug/PrompterChecks || true
          otool -L .build/debug/PrompterChecks || true
          /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS "PrompterChecks"' || true
          find ~/Library/Logs/DiagnosticReports -name 'PrompterChecks*' -maxdepth 1 -exec cat {} \; || true
      - name: Archive development build
        run: ditto -c -k --sequesterRsrc --keepParent dist/Prompter.app dist/Prompter-development.zip
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Prompter-development-${{ runner.arch }}
          path: dist/Prompter-development.zip
          retention-days: 7
