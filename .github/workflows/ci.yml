name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Core, layout, channel, and bundle checks
        run: ./scripts/check.sh
      - name: Archive development build
        run: ditto -c -k --sequesterRsrc --keepParent dist/Prompter.app dist/Prompter-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Prompter-development-${{ runner.arch }}
          path: dist/Prompter-development.zip
          retention-days: 7
