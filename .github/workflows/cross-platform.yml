name: Cross-platform preview
on:
  workflow_dispatch:
  push:
    branches: ['codex/cross-platform-preview']
    paths: ['desktop/**', 'android/**', 'website/**', '.github/workflows/cross-platform.yml']
  pull_request:
    paths: ['desktop/**', 'android/**', 'website/**', '.github/workflows/cross-platform.yml']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: windows-2025
            platform: win
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Protocol and speech alignment checks
        run: npm test --prefix desktop
      - name: Get pinned Whisper runtime source
        uses: actions/checkout@v7.0.1
        with:
          repository: ggml-org/whisper.cpp
          ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
          path: .build/whisper-source
      - name: Build portable CPU speech engine
        shell: bash
        run: |
          args=()
          native=OFF
          if [ '${{ matrix.platform }}' = win ]; then
            arch=x64
            if [ '${{ matrix.arch }}' = arm64 ]; then arch=ARM64; native=ON; fi
            args=(-A "$arch")
          fi
          cmake -S .build/whisper-source -B .build/whisper-runtime "${args[@]}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE="$native" -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build .build/whisper-runtime --config Release --target whisper-cli -j 4
          mkdir -p desktop/runtime
          cp .build/whisper-source/LICENSE desktop/runtime/whisper.cpp-LICENSE.txt
          find .build/whisper-runtime -name whisper-cli -o -name whisper-cli.exe | while read -r binary; do cp "$binary" desktop/runtime/; done
      - name: Package desktop preview
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package --prefix desktop -- --${{ matrix.platform }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: StudioPrompter-${{ matrix.platform }}-${{ matrix.arch }}-preview
          path: |
            desktop/artifacts/*.exe
            desktop/artifacts/*.AppImage
            desktop/artifacts/*.deb
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix desktop
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test Android companion
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android tablet rendering smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: StudioPrompter-Companion-Android-preview
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
