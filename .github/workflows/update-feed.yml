name: Publish update feed
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Already-published numeric release tag (for example 0.1.1)
        required: true
        type: string
      tester:
        description: Promote an early tester prerelease
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-update-feeds
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.draft
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Verify the published release and prepare its update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          TESTER_RELEASE: ${{ inputs.tester || github.event.release.prerelease }}
        run: |
          if [[ "$TESTER_RELEASE" == true ]]; then
            python3 scripts/publish-update-feed.py "$RELEASE_TAG" --tester
          else
            python3 scripts/publish-update-feed.py "$RELEASE_TAG"
          fi
      - name: Publish the verified feed
        run: |
          if git diff --quiet -- updates/; then
            echo "Update feed already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/
          git commit -m "Update public appcast for published release"
          git push origin HEAD:main
