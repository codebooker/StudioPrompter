name: Publish update feed
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Already-published stable release tag (for example 0.1.1)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: stable-update-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Verify the published release and prepare its update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 scripts/publish-update-feed.py "$RELEASE_TAG"
      - name: Publish the verified feed
        run: |
          if git diff --quiet -- updates/appcast.xml; then
            echo "Update feed already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/appcast.xml
          git commit -m "Update public appcast for published release"
          git push origin HEAD:main
