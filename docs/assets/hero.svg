<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="title desc">
<title id="title">StudioPrompter</title><desc id="desc">Stay present. We'll keep your place. Native macOS prompting with local voice following and a dedicated talent display.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1d222c"/><stop offset="1" stop-color="#0b0d11"/></linearGradient><linearGradient id="band"><stop stop-color="#ff8147" stop-opacity=".18"/><stop offset="1" stop-color="#ff8147" stop-opacity=".03"/></linearGradient></defs>
<rect width="1440" height="490" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="#ff8147" stroke-width="5" stroke-linecap="round"><path d="M70 70h30M70 81h22M70 92h30M70 103h15"/></g>
<text x="120" y="96" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="27" fill="#f8f7f5" font-weight="700">StudioPrompter</text>
<text x="70" y="206" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="62" fill="#fff" font-weight="700">Stay present.</text>
<text x="70" y="283" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="54" fill="#ff925f" font-weight="700">We'll keep your place.</text>
<text x="73" y="344" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="21" fill="#b2bac8">Your voice. Your pace. Your production.</text>
<text x="73" y="423" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" letter-spacing="3" fill="#8f9bac">NATIVE MACOS  /  LOCAL WHISPER  /  TWO SCREENS</text>
<g transform="translate(855 80)"><rect width="510" height="313" rx="14" fill="#0e1117" stroke="#3a404c"/><rect x="1" y="86" width="508" height="126" fill="url(#band)"/>
<path d="M23 135l14 13-14 13z" fill="#ff8147"/>
<g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="27" font-weight="600"><text x="56" y="62" fill="#535c6c">Give the conversation room.</text><text x="56" y="127" fill="#fff">Look up. Take your time.</text><text x="56" y="176" fill="#fff">The next line is right here.</text><text x="56" y="253" fill="#535c6c">Make the moment yours.</text></g>
<path d="M210 313v24h90v-24" fill="#222834"/><rect x="167" y="337" width="177" height="8" rx="4" fill="#38414f"/>
<rect x="292" y="274" width="177" height="27" rx="13" fill="#172b25"/><circle cx="308" cy="287" r="4" fill="#74d4ae"/><text x="321" y="292" font-family="Arial,sans-serif" font-size="12" fill="#a1e1c6" letter-spacing="1">LOCAL VOICE FOLLOW</text></g>
</svg>
